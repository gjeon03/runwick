<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>재부팅 후 재개 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1012}
a{color:inherit;text-decoration:none}
a:hover,button:hover{filter:brightness(1.18)}
:focus-visible{outline:2px solid #EDEDF0;outline-offset:1px}
@keyframes wick{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:100%;height:100vh;min-height:640px;display:flex;flex-direction:column;overflow:hidden;background:#0F1012;color:#EDEDF0;font-family:Geist,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;line-height:1.45">
  <div style="flex:none"><dc-import name="Titlebar" needs="0" running="0" hint-size="100%,44px"></dc-import></div>
  <div style="flex:1;min-height:0;display:flex;flex-wrap:wrap;overflow:auto">
    <nav aria-label="프로젝트 탐색" style="flex:0 0 264px;min-width:0;min-height:480px;display:flex;flex-direction:column;overflow:hidden;background:#15161A;border-right:1px solid #25262B"><dc-import name="Sidebar" scene="restored" hint-size="264px,100%"></dc-import></nav>
    <main style="flex:999 1 520px;min-width:0;min-height:480px;overflow-y:auto;padding:40px 32px;box-sizing:border-box;background:#101114">
      <div style="max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px">
        <header style="display:flex;flex-direction:column;gap:6px">
          <h1 style="margin:0;font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-0.01em">이어갈 세션을 골라 주세요</h1>
          <p style="margin:0;color:#B0B1B8">컴퓨터가 다시 시작돼 실행은 끝났어요. 화면과 기록은 복원했고, 어떤 명령도 자동으로 실행하지 않았습니다.</p>
        </header>
        <ul aria-label="세션 목록" style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-radius:12px;background:#17181C;overflow:hidden">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
            <li style="display:flex;border-bottom:1px solid #25262B">
              <label style="flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;color:{{r.fg}}">
                <input type="checkbox" checked="{{r.on}}" disabled="{{r.off}}" aria-label="{{r.t}} 선택" style="flex:none;width:15px;height:15px;margin:0;accent-color:#FF8B3E">
                <span aria-hidden="true" style="flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:#26272D;font-family:'JetBrains Mono',Menlo,monospace;font-size:10px;font-weight:500">{{r.k}}</span>
                <span style="flex:1;min-width:0;display:flex;flex-direction:column">
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500">{{r.t}}</span>
                  <span title="{{r.where}}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#8E8F98">{{r.where}}</span>
                </span>
                <span style="flex:none;font-size:12px;color:{{r.c}}">{{r.how}}</span>
              </label>
            </li>
          </sc-for>
        </ul>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
          <span style="flex:1 1 240px;min-width:0;font-size:12.500px;color:#8E8F98">재개할 때 대화 ID가 같은지 확인해요. 다르면 새 대화로 바꾸지 않고 알려 드립니다.</span>
          <a href="Timeline.dc.html" style="flex:none;height:34px;display:flex;align-items:center;padding:0 12px;border-radius:7px;background:#26272D">기록만 보기</a>
          <a href="Session.dc.html" style="flex:none;height:34px;display:flex;align-items:center;padding:0 14px;border-radius:7px;background:#FF8B3E;color:#1B0F06;font-weight:600">선택한 2개 재개</a>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = { c: '#5AD6A4', how: '같은 대화 재개' };
    const r = (k, t, where, how, c, on, off) => ({ k, t, where, how, c, on, off, fg: off ? '#8E8F98' : '#EDEDF0' });
    return {
      rows: [
        r('Cl', '로그인 오류 수정', 'payments-api / 기본 공간 · 어제 18:42', ok.how, ok.c, true, false),
        r('Cl', '정산 리포트 초안 작성', '사내 정산 리포트 자동화 및 문서 정리 프로젝트 / 기본 공간', ok.how, ok.c, true, false),
        r('Cx', '회귀 검토', 'payments-api / 기본 공간 · 로그인 오류 수정에서 위임', ok.how, ok.c, false, false),
        r('$', 'zsh', 'payments-api / 기본 공간', '새 셸로 시작', '#B0B1B8', false, false),
        r('Cx', 'API 스키마 확인', '저장된 대화 ID가 없어요', '기록만 볼 수 있음', '#8E8F98', false, true)
      ]
    };
  }
}
</script>
</body>
</html>
