<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공통 환경변수</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1012}
a{color:inherit;text-decoration:none}
a:hover,button:hover{filter:brightness(1.18)}
:focus-visible{outline:2px solid #EDEDF0;outline-offset:1px}
@keyframes wick{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:100%;height:100vh;min-height:640px;display:flex;flex-direction:column;overflow:hidden;background:#0F1012;color:#EDEDF0;font-family:Geist,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;line-height:1.45">
  <div style="flex:none"><dc-import name="Titlebar" needs="0" running="3" settings-href="Session.dc.html" hint-size="100%,44px"></dc-import></div>
  <div style="flex:1;min-height:0;display:flex;flex-wrap:wrap;overflow:auto">
    <nav aria-label="설정 분류" style="flex:0 0 232px;min-width:0;box-sizing:border-box;display:flex;flex-direction:column;gap:1px;padding:12px 8px;background:#15161A;border-right:1px solid #25262B">
      <a href="Session.dc.html" style="height:30px;display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:0 8px;border-radius:6px;font-size:12.500px;color:#B0B1B8">
        <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.600;stroke-linecap:round;stroke-linejoin:round"><path d="M13 8H3M7 4 3 8l4 4"></path></svg>작업실로 돌아가기
      </a>
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
        <a href="{{n.href}}" aria-current="{{n.cur}}" style="height:30px;display:flex;align-items:center;padding:0 10px;border-radius:6px;background:{{n.bg}};color:{{n.fg}}">{{n.t}}</a>
      </sc-for>
    </nav>
    <main style="flex:999 1 520px;min-width:0;overflow-y:auto;padding:28px 32px;background:#101114">
      <div style="max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:22px">
        <header style="display:flex;flex-direction:column;gap:4px">
          <h1 style="margin:0;font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-0.01em">공통 환경변수</h1>
          <p style="margin:0;color:#B0B1B8">Runwick이 시작하는 모든 CLI에 같은 값을 넘깁니다. 프로젝트별 값은 <span style="font-family:'JetBrains Mono',Menlo,monospace;font-size:12px;color:#D6D7DC">.env</span> 같은 프로젝트 도구에서 관리하세요.</p>
        </header>
        <section aria-label="환경변수 목록" style="display:flex;flex-direction:column;border-radius:12px;background:#17181C;overflow:hidden">
          <sc-for list="{{vars}}" as="v" hint-placeholder-count="3">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-height:50px;padding:8px 14px;border-bottom:1px solid #25262B">
              <span style="flex:1 1 200px;min-width:0;display:flex;flex-direction:column">
                <span style="font-family:'JetBrains Mono',Menlo,monospace;font-size:12.500px">{{v.k}}</span>
                <span style="font-size:12px;color:#8E8F98">{{v.d}}</span>
              </span>
              <span style="flex:1 1 160px;min-width:0;font-family:'JetBrains Mono',Menlo,monospace;font-size:12.500px;color:#B0B1B8">{{v.val}}</span>
              <span style="flex:0 0 112px;font-size:12px;color:{{v.c}}">{{v.st}}</span>
              <a href="#" aria-label="{{v.k}} 편집" title="편집" style="flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#26272D">
                <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.400;stroke-linecap:round;stroke-linejoin:round"><path d="M11 2.500l2.500 2.500L5.500 13H3v-2.500Z"></path></svg>
              </a>
            </div>
          </sc-for>
          <a href="#" style="display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;font-size:12.500px;color:#B0B1B8">
            <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.700;stroke-linecap:round"><path d="M8 3v10M3 8h10"></path></svg>변수 추가
          </a>
        </section>
        <section aria-label="적용 대기 세션" style="display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;flex-direction:column;gap:2px">
            <h2 style="margin:0;font-size:14px;font-weight:600">저장됐어요. 실행 중인 세션에는 아직 적용 전입니다</h2>
            <p style="margin:0;font-size:12.500px;color:#B0B1B8">저장만으로 세션을 재시작하지 않아요. 필요한 세션만 골라 새로고침하세요. 대화는 그대로 이어집니다.</p>
          </div>
          <div style="display:flex;flex-direction:column;border-radius:12px;background:#17181C;overflow:hidden">
            <sc-for list="{{pending}}" as="p" hint-placeholder-count="3">
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-height:50px;padding:8px 8px 8px 14px;border-bottom:1px solid #25262B">
                <span aria-hidden="true" style="flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:#26272D;font-family:'JetBrains Mono',Menlo,monospace;font-size:10px;font-weight:500">{{p.k}}</span>
                <span style="flex:1 1 220px;min-width:0;display:flex;flex-direction:column">
                  <span style="font-weight:500">{{p.t}}</span>
                  <span style="font-size:12px;color:#8E8F98">{{p.m}}</span>
                </span>
                <a href="{{p.href}}" style="flex:none;height:28px;display:flex;align-items:center;padding:0 10px;border-radius:6px;background:#26272D;font-size:12px">{{p.act}}</a>
              </div>
            </sc-for>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const nav = [
      ['일반', '#'], ['CLI 도구', '#'], ['공통 환경변수', 'Settings.dc.html', true], ['MCP', '#'],
      ['협업', '#'], ['역할·작업 방식', '#'], ['자동 작업', 'Automation.dc.html'], ['기기', 'Devices.dc.html'], ['저장·가져오기', 'Backup.dc.html']
    ];
    return {
      nav: nav.map((x) => ({ t: x[0], href: x[1], cur: x[2] ? 'page' : 'false', bg: x[2] ? '#26272D' : 'transparent', fg: x[2] ? '#EDEDF0' : '#B0B1B8' })),
      vars: [
        { k: 'GITHUB_TOKEN', d: '보안 저장소에 보관', val: '••••••••', st: '방금 변경·저장', c: '#FF8B3E' },
        { k: 'HTTP_PROXY', d: '사내망 프록시', val: 'http://proxy.local:3128', st: '저장됨', c: '#8E8F98' },
        { k: 'NODE_OPTIONS', d: '메모리 한도', val: '--max-old-space-size=4096', st: '저장됨', c: '#8E8F98' }
      ],
      pending: [
        { k: 'Cl', t: '로그인 오류 수정', m: 'payments-api / 기본 공간 · 응답 생성 중', act: '새로고침', href: 'Refresh.dc.html' },
        { k: 'Cl', t: '정산 리포트 초안 작성', m: '사내 정산 리포트 자동화 및 문서 정리 프로젝트 / 기본 공간 · 입력 대기', act: '새로고침', href: 'RefreshPartial.dc.html' },
        { k: '$', t: 'zsh', m: 'payments-api / 기본 공간 · 일반 셸은 대화를 이어갈 수 없어 새로 시작해요', act: '셸 다시 시작', href: '#' }
      ]
    };
  }
}
</script>
</body>
</html>
