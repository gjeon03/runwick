<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>탭</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="열린 탭" style="width:100%;height:38px;box-sizing:border-box;display:flex;align-items:stretch;background:#15161A;border-bottom:1px solid #25262B;color:#B0B1B8;font-family:Geist,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12.5px;white-space:nowrap">
  <div style="flex:1;min-width:0;display:flex;overflow:hidden">
    <sc-for list="{{items}}" as="t" hint-placeholder-count="2">
      <a href="{{t.href}}" title="{{t.full}}" aria-current="{{t.cur}}" style="flex:0 1 220px;min-width:90px;box-sizing:border-box;display:flex;align-items:center;gap:7px;padding:0 10px;background:{{t.bg}};color:{{t.fg}};border-right:1px solid #25262B">
        <span aria-hidden="true" style="flex:none;min-width:20px;height:18px;padding:0 3px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:4px;background:#26272D;color:#D6D7DC;font-family:'JetBrains Mono',Menlo,monospace;font-size:9.500px;font-weight:500">{{t.k}}</span>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">{{t.t}}</span>
        <sc-if value="{{t.hasDot}}" hint-placeholder-val="{{ true }}"><span role="img" aria-label="{{t.dotName}}" style="flex:none;width:7px;height:7px;border-radius:50%;background:{{t.dot}};animation:{{t.anim}}"></span></sc-if>
      </a>
    </sc-for>
  </div>
  <div style="flex:none;display:flex;align-items:center;gap:2px;padding:0 6px;border-left:1px solid #25262B">
    <a href="Start.dc.html" aria-label="새 CLI 세션" title="새 CLI 세션 (⌘T)" style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.500;stroke-linecap:round"><path d="M8 3v10M3 8h10"></path></svg>
    </a>
    <a href="Docs.dc.html" aria-label="나란히 보기" title="나란히 보기" style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.400;stroke-linejoin:round"><path d="M2 3h12v10H2ZM8 3v10"></path></svg>
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tabs":{"editor":null},"$preview":{"width":900,"height":38}}'>
class Component extends DCLogic {
  renderVals() {
    const DOT = {
      run: { c: '#5AD6A4', n: '실행 중', a: 'wick 1.8s ease-in-out infinite' },
      need: { c: '#FF8B3E', n: '확인 필요', a: 'none' },
      fresh: { c: '#74B7FF', n: '새 결과', a: 'none' },
      fail: { c: '#FF7B86', n: '복구 필요', a: 'none' },
      direct: { c: '#BBA2FF', n: '직접 조작 중', a: 'none' },
      mod: { c: '#EDEDF0', n: '미저장', a: 'none' }
    };
    const raw = this.props.tabs ?? [
      { t: '로그인 오류 수정', k: 'Cl', st: 'run', sel: true, href: 'Session.dc.html' },
      { t: 'zsh', k: '$', href: 'Session.dc.html' }
    ];
    return {
      items: raw.map((x) => {
        const d = x.st ? DOT[x.st] : null;
        return {
          t: x.t, k: x.k, href: x.href ?? '#', full: x.full ?? x.t,
          cur: x.sel ? 'page' : 'false',
          bg: x.sel ? '#0B0C0E' : 'transparent',
          fg: x.sel ? '#EDEDF0' : '#B0B1B8',
          hasDot: !!d, dot: d ? d.c : 'transparent', dotName: d ? d.n : '', anim: d ? d.a : 'none'
        };
      })
    };
  }
}
</script>
</body>
</html>
