<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>외부 변경 비교</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1012}
a{color:inherit;text-decoration:none}
a:hover,button:hover{filter:brightness(1.18)}
:focus-visible{outline:2px solid #EDEDF0;outline-offset:1px}
@keyframes wick{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:100%;height:100vh;min-height:640px;display:flex;flex-direction:column;overflow:hidden;background:#0F1012;color:#EDEDF0;font-family:Geist,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;line-height:1.45">
  <div style="flex:none"><dc-import name="Titlebar" needs="0" running="1" hint-size="100%,44px"></dc-import></div>
  <div style="flex:1;min-height:0;display:flex;flex-wrap:wrap;overflow:auto">
    <nav aria-label="프로젝트 탐색" style="flex:0 0 264px;min-width:0;min-height:480px;display:flex;flex-direction:column;overflow:hidden;background:#15161A;border-right:1px solid #25262B"><dc-import name="Sidebar" scene="files" hint-size="264px,100%"></dc-import></nav>
    <main style="flex:999 1 520px;min-width:0;min-height:480px;display:flex;flex-direction:column;background:#101114">
      <div style="flex:none"><dc-import name="Tabs" tabs="{{tabs}}" hint-size="100%,38px"></dc-import></div>
      <header style="flex:none;display:flex;flex-direction:column;gap:2px;padding:18px 20px 14px">
        <h1 style="margin:0;font-size:18px;font-weight:600">저장하기 전에 auth-notes.md가 바뀌었어요</h1>
        <p style="margin:0;color:#B0B1B8">디스크 변경: Claude Code · 로그인 오류 수정 · 1분 전. 어떤 쪽을 남길지 정할 때까지 아무것도 덮어쓰지 않습니다.</p>
      </header>
      <div style="flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:8px;padding:0 20px 16px;align-content:start">
        <sc-for list="{{cols}}" as="col" hint-placeholder-count="3">
          <section aria-label="{{col.name}}" style="display:flex;flex-direction:column;border-radius:10px;background:#17181C;overflow:hidden">
            <header style="display:flex;flex-direction:column;padding:10px 14px;border-bottom:1px solid #25262B">
              <span style="font-weight:500">{{col.name}}</span>
              <span style="font-size:12px;color:#8E8F98">{{col.sub}}</span>
            </header>
            <div style="padding:10px 0">
              <sc-for list="{{col.lines}}" as="l" hint-placeholder-count="6">
                <div style="min-height:22px;padding:0 14px;background:{{l.bg}};color:{{l.c}};font-family:'JetBrains Mono','SF Mono',Menlo,'Apple SD Gothic Neo',monospace;font-size:12.500px;line-height:22px;white-space:pre-wrap">{{l.t}}</div>
              </sc-for>
            </div>
          </section>
        </sc-for>
      </div>
      <footer style="flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 20px;background:#15161A;border-top:1px solid #25262B">
        <span style="flex:1 1 240px;min-width:0;font-size:12.500px;color:#8E8F98">선택한 내용을 저장하기 직전에 최신 파일 버전을 한 번 더 확인합니다.</span>
        <a href="Docs.dc.html" style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:7px;background:#26272D;font-size:12.500px">계속 편집</a>
        <a href="Space.dc.html" style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:7px;background:#26272D;font-size:12.500px">디스크 내용 사용</a>
        <a href="Space.dc.html" style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:7px;background:#FF8B3E;color:#1B0F06;font-size:12.500px;font-weight:600">두 변경 합쳐 저장</a>
      </footer>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const plain = (t) => ({ t: t || ' ', c: '#B0B1B8', bg: 'transparent' });
    const add = (t) => ({ t, c: '#7EE0A8', bg: '#10281C' });
    const mine = (t) => ({ t, c: '#D9CCFF', bg: '#211B33' });
    const base = ['## 수정 방향', '- 비교 전에 단위를 맞춘다.', '- refresh 경로의 단위도 함께 확인한다.'];
    return {
      tabs: [
        { t: '로그인 오류 수정', k: 'Cl', st: 'run', href: 'Session.dc.html' },
        { t: 'auth-notes.md 비교', k: 'md', st: 'mod', sel: true, href: 'DocConflict.dc.html', full: 'docs/auth-notes.md · 외부 변경 비교' }
      ],
      cols: [
        { name: '기준 버전', sub: '내가 편집을 시작한 시점 · 11:02', lines: base.map(plain) },
        { name: '내 편집', sub: '미저장 · 앱을 닫아도 복원됩니다', lines: base.map(plain).concat([mine('- 팀 공유 전에 재현 절차를 적어 둔다.')]) },
        { name: '디스크 내용', sub: 'Claude Code가 저장 · 11:06', lines: base.map(plain).concat([add('- 테스트: pnpm test auth 14 passed')]) }
      ]
    };
  }
}
</script>
</body>
</html>
