<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>일부 MCP 실패</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1012}
a{color:inherit;text-decoration:none}
a:hover,button:hover{filter:brightness(1.18)}
:focus-visible{outline:2px solid #EDEDF0;outline-offset:1px}
@keyframes wick{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:100%;height:100vh;min-height:640px;display:flex;flex-direction:column;overflow:hidden;background:#0F1012;color:#EDEDF0;font-family:Geist,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;line-height:1.45">
  <div style="flex:none"><dc-import name="Titlebar" needs="1" running="3" hint-size="100%,44px"></dc-import></div>
  <div style="flex:1;min-height:0;display:flex;flex-wrap:wrap;overflow:auto">
    <nav aria-label="프로젝트 탐색" style="flex:0 0 264px;min-width:0;min-height:480px;display:flex;flex-direction:column;overflow:hidden;background:#15161A;border-right:1px solid #25262B"><dc-import name="Sidebar" scene="daily" hint-size="264px,100%"></dc-import></nav>
    <main style="position:relative;flex:999 1 520px;min-width:0;min-height:480px;display:flex;flex-direction:column;background:#0B0C0E">
      <div style="flex:none"><dc-import name="Tabs" tabs="{{tabs}}" hint-size="100%,38px"></dc-import></div>
      <div style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden"><dc-import name="Term" scene="daily" next="Session.dc.html" label="터미널. 같은 대화에서 계속 입력할 수 있습니다" hint-size="100%,100%"></dc-import></div>
      <div style="flex:none"><dc-import name="SessionBar" state="need" label="MCP 1개 인증 필요" meta="같은 대화에서 계속 입력할 수 있어요" refresh-pending="true" hint-size="100%,34px"></dc-import></div>
      <section role="status" aria-label="새로고침 결과" style="position:absolute;right:12px;bottom:46px;width:400px;max-width:calc(100% - 24px);box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:12px;background:#1B1C20;box-shadow:0 0 0 1px #33343B,0 16px 48px rgba(0,0,0,.5)">
        <div style="display:flex;flex-direction:column;gap:2px">
          <h1 style="margin:0;font-size:15px;font-weight:600">일부만 적용됐어요</h1>
          <p style="margin:0;font-size:12.500px;color:#B0B1B8">같은 대화로 다시 연결했습니다. linear 연결만 남았어요.</p>
        </div>
        <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px">
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
            <li style="display:flex;align-items:flex-start;gap:8px">
              <svg width="14" height="14" viewBox="0 0 16 16" role="img" aria-label="{{s.state}}" style="flex:none;margin-top:2px;fill:none;stroke:{{s.c}};stroke-width:1.600;stroke-linecap:round;stroke-linejoin:round"><path d="{{s.i}}"></path></svg>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column">
                <span style="color:{{s.fg}}">{{s.t}}</span>
                <sc-if value="{{s.m}}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#8E8F98">{{s.m}}</span></sc-if>
              </span>
            </li>
          </sc-for>
        </ul>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          <a href="Session.dc.html" style="height:30px;display:flex;align-items:center;padding:0 12px;border-radius:7px;background:#FF8B3E;color:#1B0F06;font-size:12.500px;font-weight:600">linear 인증</a>
          <a href="RefreshPartial.dc.html" style="height:30px;display:flex;align-items:center;padding:0 12px;border-radius:7px;background:#26272D;font-size:12.500px">이 세션에서 다시 시도</a>
          <a href="Session.dc.html" style="height:30px;display:flex;align-items:center;padding:0 12px;border-radius:7px;font-size:12.500px;color:#B0B1B8">닫기</a>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = (t, m) => ({ t, m: m ?? '', state: '완료', c: '#5AD6A4', fg: '#D6D7DC', i: 'M3 8.500l3.500 3.500L13 4.500' });
    return {
      tabs: [
        { t: '로그인 오류 수정', k: 'Cl', st: 'need', sel: true, href: 'Session.dc.html' },
        { t: 'zsh', k: '$', href: 'Session.dc.html' }
      ],
      steps: [
        ok('기록 저장'),
        ok('같은 대화로 재연결', '대화 ID가 이전과 같음을 확인했어요'),
        ok('공통 환경변수 적용'),
        ok('MCP github 연결'),
        { t: 'MCP linear 인증 필요', m: '브라우저 로그인이 끝나야 연결돼요', state: '인증 필요', c: '#FF8B3E', fg: '#FFFFFF', i: 'M8 14.500a6.500 6.500 0 1 0 0-13 6.500 6.500 0 0 0 0 13ZM8 4.500V9M8 11.500h.01' }
      ]
    };
  }
}
</script>
</body>
</html>
