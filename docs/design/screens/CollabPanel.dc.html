<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>협업 패널</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;background:#17181C;color:#B0B1B8;font-family:Geist,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;line-height:1.45">
  <div style="flex:none;display:flex;flex-direction:column;gap:10px;padding:14px 14px 12px">
    <div style="display:flex;flex-direction:column;gap:2px">
      <h2 style="margin:0;font-size:15px;font-weight:600;color:#EDEDF0">로그인 오류 수정</h2>
      <p style="margin:0;font-size:12.500px;color:#B0B1B8">{{summary}}</p>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <a href="{{holdHref}}" style="height:28px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:6px;background:{{holdBg}};color:{{holdFg}};font-size:12.500px;font-weight:{{holdW}}">
        <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.700;stroke-linecap:round;stroke-linejoin:round"><path d="{{holdIcon}}"></path></svg>{{holdLabel}}
      </a>
      <a href="Quit.dc.html" aria-label="협업 더 보기" title="요청 원문, 시도 이력, 협업 중단" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#26272D;color:#D6D7DC">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M3 8h.01M8 8h.01M13 8h.01"></path></svg>
      </a>
    </div>
    <sc-if value="{{hasHoldNote}}" hint-placeholder-val="{{ false }}">
      <p style="margin:0;font-size:12px;color:#8E8F98">이미 시작한 작업은 계속되고 결과는 저장됩니다. 새 전달만 멈춘 상태예요. 재개할 때 경로와 입력권을 다시 확인합니다.</p>
    </sc-if>
  </div>
  <ul aria-label="맡긴 일" style="flex:1;min-height:0;overflow-y:auto;list-style:none;margin:0;padding:0 8px 8px;display:flex;flex-direction:column;gap:4px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <li style="display:flex;flex-direction:column;border-radius:8px;background:{{r.bg}}">
        <a href="{{r.href}}" style="display:flex;gap:9px;padding:10px">
          <svg width="15" height="15" viewBox="0 0 16 16" role="img" aria-label="{{r.state}}" style="flex:none;margin-top:2px;fill:none;stroke:{{r.c}};stroke-width:1.500;stroke-linecap:round;stroke-linejoin:round;animation:{{r.anim}}"><path d="{{r.i}}"></path></svg>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="display:flex;align-items:baseline;gap:8px">
              <span style="flex:1;min-width:0;color:#EDEDF0;font-weight:500">{{r.t}}</span>
              <span style="flex:none;font-size:12px;font-weight:500;color:{{r.c}}">{{r.state}}</span>
            </span>
            <span style="font-size:12px;color:#B0B1B8">{{r.who}}</span>
            <span title="{{r.where}}" style="font-family:'JetBrains Mono',Menlo,monospace;font-size:11px;color:#8E8F98;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{r.where}}</span>
            <span style="margin-top:4px;font-size:12.500px;color:#D6D7DC">{{r.now}}</span>
            <span style="font-size:11.500px;color:#8E8F98">{{r.when}}</span>
          </span>
        </a>
        <sc-if value="{{r.hasActions}}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px 34px">
            <sc-for list="{{r.actions}}" as="b" hint-placeholder-count="2">
              <a href="{{b.href}}" style="height:26px;display:flex;align-items:center;padding:0 9px;border-radius:6px;background:{{b.bg}};color:{{b.fg}};font-size:12px;font-weight:{{b.w}}">{{b.t}}</a>
            </sc-for>
          </div>
        </sc-if>
      </li>
    </sc-for>
  </ul>
  <div style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid #25262B;font-size:12px;color:#8E8F98">
    <span title="관측할 수 없는 내장 작업은 제외한 수입니다">{{slots}}</span>
    <a href="Automation.dc.html" style="flex:none;color:#B0B1B8;text-decoration:underline">작업 방식 저장</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scene":{"editor":"enum","options":["live","direct","uncertain"],"default":"live"},"$preview":{"width":380,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const scene = this.props.scene ?? 'live';
    const selected = this.props.selected ?? '';
    const I = {
      need: 'M8 14.500a6.500 6.500 0 1 0 0-13 6.500 6.500 0 0 0 0 13ZM8 4.500V9M8 11.500h.01',
      run: 'M8 14.500a6.500 6.500 0 1 0 0-13 6.500 6.500 0 0 0 0 13ZM8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z',
      hold: 'M5.500 3.500v9M10.500 3.500v9',
      direct: 'M1.500 4h13v8h-13ZM4 7h.01M6.500 7h.01M9 7h.01M11.500 7h.01M5 9.500h6',
      play: 'M5 3l8 5-8 5Z'
    };
    const btn = (t, href, primary) => ({ t, href, bg: primary ? '#FF8B3E' : '#26272D', fg: primary ? '#1B0F06' : '#EDEDF0', w: primary ? 600 : 400 });
    const row = (id, o) => ({
      ...o,
      bg: selected === id ? '#26272D' : '#1F2025',
      actions: o.actions ?? [],
      hasActions: (o.actions ?? []).length > 0
    });
    const review = { t: '회귀 검토', who: '검토 · Codex', where: '기본 공간 / main · 스냅샷 a41f3c2', href: 'Peek.dc.html' };
    const tests = row('tests', { t: 'refresh 토큰 테스트 작성', who: '구현 · Claude Code', where: 'auth-tests / feat/refresh-tests', href: 'Space.dc.html', state: '진행 중', c: '#5AD6A4', i: I.run, anim: 'wick 1.8s ease-in-out infinite', now: 'src/auth/refresh.test.ts 작성 중', when: '마지막 보고 12초 전' });
    const docsBase = { t: '변경 내용 문서화', who: '문서 · Claude Code', where: '기본 공간 / main', href: 'Collab2.dc.html', c: '#8E8F98', i: I.hold, anim: 'none' };

    let rows, summary = '응답 완료 · 협업 2개 진행 · 확인 필요 1';
    let held = false;
    let slots = '자동 배정 한도 4 · 관측 실행 3';
    if (scene === 'live') {
      rows = [
        row('review', { ...review, state: '승인 필요', c: '#FF8B3E', i: I.need, anim: 'none', now: 'pnpm test:e2e 실행 승인을 기다립니다', when: '요청 40초 전' }),
        tests,
        row('docs', { ...docsBase, state: '대기', now: '선행 작업 대기: refresh 토큰 테스트 작성', when: '시작 전' })
      ];
    } else if (scene === 'direct') {
      summary = '응답 완료 · 협업 2개 진행 · 직접 조작 1';
      rows = [
        row('review', { ...review, href: 'Direct.dc.html', state: '직접 조작 중', c: '#BBA2FF', i: I.direct, anim: 'none', now: '자동 지시 1건은 반환할 때까지 대기합니다', when: '내가 입력 중', actions: [btn('다시 맡기기', 'Result.dc.html', false)] }),
        tests,
        row('docs', { ...docsBase, state: '대기', now: '선행 작업 대기: refresh 토큰 테스트 작성', when: '시작 전' })
      ];
    } else {
      summary = '새 배정 보류 중 · 실행 중 1 · 미전달 대기 1';
      held = true;
      slots = '자동 배정 한도 4 · 관측 실행 2';
      rows = [
        row('docs', { ...docsBase, href: 'Peek.dc.html', state: '전달 확인 필요', c: '#FF8B3E', i: I.need, now: '전달 직후 연결이 끊겨 수신 여부를 아직 모릅니다. 자동으로 다시 보내지 않았습니다.', when: '접수 r-0414 · 2분 전', actions: [btn('상태 조회', 'Collab2.dc.html', true), btn('CLI 화면 보기', 'Peek.dc.html', false)] }),
        row('review', { ...review, state: '진행 중', c: '#5AD6A4', i: I.run, anim: 'wick 1.8s ease-in-out infinite', now: 'src/auth/session.ts 변경분 읽는 중', when: '마지막 보고 8초 전' }),
        row('notes', { t: '릴리스 노트 초안', who: '문서 · Claude Code', where: '기본 공간 / main', href: 'Collab2.dc.html', c: '#8E8F98', i: I.hold, anim: 'none', state: '미전달 대기', now: '배정을 재개하면 선행 결과를 확인한 뒤 전달합니다', when: '접수 r-0415', actions: [btn('이 요청 취소', 'Collab2.dc.html', false)] })
      ];
    }
    return {
      rows, summary, slots,
      hasHoldNote: held,
      holdLabel: held ? '배정 재개' : '새 배정 보류',
      holdIcon: held ? I.play : I.hold,
      holdBg: held ? '#FF8B3E' : '#26272D',
      holdFg: held ? '#1B0F06' : '#EDEDF0',
      holdW: held ? 600 : 400,
      holdHref: held ? 'Collab2.dc.html' : 'Uncertain.dc.html'
    };
  }
}
</script>
</body>
</html>
