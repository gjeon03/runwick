<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기본 공간에서 CLI 고르기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1012}
a{color:inherit;text-decoration:none}
a:hover,button:hover{filter:brightness(1.18)}
:focus-visible{outline:2px solid #EDEDF0;outline-offset:1px}
@keyframes wick{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:100%;height:100vh;min-height:640px;display:flex;flex-direction:column;overflow:hidden;background:#0F1012;color:#EDEDF0;font-family:Geist,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;line-height:1.45">
  <div style="flex:none"><dc-import name="Titlebar" needs="0" running="0" hint-size="100%,44px"></dc-import></div>
  <div style="flex:1;min-height:0;display:flex;flex-wrap:wrap;overflow:auto">
    <nav aria-label="프로젝트 탐색" style="flex:0 0 264px;min-width:0;min-height:480px;display:flex;flex-direction:column;overflow:hidden;background:#15161A;border-right:1px solid #25262B"><dc-import name="Sidebar" scene="fresh" hint-size="264px,100%"></dc-import></nav>
    <main style="flex:999 1 520px;min-width:0;min-height:480px;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box;background:#0F1012">
      <div style="width:100%;max-width:640px;display:flex;flex-direction:column;gap:24px">
        <div style="display:flex;flex-direction:column;gap:6px">
          <h1 style="margin:0;font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-0.01em">어떤 CLI로 시작할까요?</h1>
          <p style="margin:0;color:#B0B1B8">기본 공간이 준비됐어요. 세션은 <span style="font-family:'JetBrains Mono',Menlo,monospace;font-size:12px;color:#D6D7DC">~/work/payments-api</span> 폴더에서 열립니다.</p>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:8px">
          <sc-for list="{{tools}}" as="t" hint-placeholder-count="3">
            <a href="Session.dc.html" style="display:flex;flex-direction:column;gap:12px;min-height:128px;box-sizing:border-box;padding:14px;border-radius:10px;background:#1F2025">
              <span aria-hidden="true" style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#33343B;font-family:'JetBrains Mono',Menlo,monospace;font-size:11.500px;font-weight:500">{{t.k}}</span>
              <span style="display:flex;flex-direction:column;gap:2px">
                <span style="font-size:14px;font-weight:500">{{t.name}}</span>
                <span style="font-size:12px;color:{{t.c}}">{{t.state}}</span>
              </span>
            </a>
          </sc-for>
        </div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:12.500px;color:#8E8F98">
          <span>먼저 둘러보려면</span>
          <a href="Docs.dc.html" style="color:#D6D7DC;text-decoration:underline">파일 보기</a>
          <a href="Docs.dc.html" style="color:#D6D7DC;text-decoration:underline">README.md 열기</a>
          <span style="margin-left:auto">새 세션 ⌘T</span>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      tools: [
        { k: 'Cl', name: 'Claude Code', state: '바로 시작할 수 있어요', c: '#5AD6A4' },
        { k: 'Cx', name: 'Codex', state: 'CLI의 로그인 화면이 열려요', c: '#FF8B3E' },
        { k: '$', name: '셸', state: 'zsh · 대화 기록 없음', c: '#B0B1B8' }
      ]
    };
  }
}
</script>
</body>
</html>
