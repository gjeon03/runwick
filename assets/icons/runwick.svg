<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Runwick app icon: Graphite Wick ground with the one ember wick flame (docs/design, logo mark). -->
  <defs>
    <linearGradient id="ground" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27282E"/>
      <stop offset="1" stop-color="#111214"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="430" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8B3E" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#FF8B3E" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FF8B3E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="2" x2="0" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA766"/>
      <stop offset="1" stop-color="#FF8B3E"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ground)" filter="url(#shadow)"/>
  <g clip-path="url(#body)">
    <circle cx="512" cy="430" r="300" fill="url(#glow)"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
  <g transform="translate(248 239.75) scale(22)">
    <path d="M12 2c1 3.6 5 5.6 5 10a5 5 0 0 1-10 0c0-2.2 1.2-3.4 2-4.4.3 1.4 1.1 2.1 1.8 2.1C10.6 7.2 10.6 4.6 12 2Z" fill="url(#flame)"/>
    <path d="M12 18v4" fill="none" stroke="#8E8F98" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
